services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  location-service:
    build:
      context: .
      dockerfile: backend/location-service/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:3000,https://map.avision-gb10.org,https://map2.avision-gb10.org
      WORKERS: "4"
    ports:
      - "8001:8000"
    depends_on:
      - redis

  event-service:
    build:
      context: .
      dockerfile: backend/event-service/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      EVENT_IDEMPOTENCY_PREFIX: realtime_map_notice:event:idempotency
      EVENT_IDEMPOTENCY_TTL_SECONDS: 300
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:3000,https://map.avision-gb10.org,https://map2.avision-gb10.org
      WORKERS: "4"
    ports:
      - "8002:8000"
    depends_on:
      - redis
      - notification-service

  notification-service:
    build:
      context: .
      dockerfile: backend/notification-service/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:3000,https://map.avision-gb10.org,https://map2.avision-gb10.org
      WORKERS: "1"
    ports:
      - "8003:8000"
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8095:8080"
    depends_on:
      - location-service
      - event-service
      - notification-service
