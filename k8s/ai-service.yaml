apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: realtime-map-notice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: realtime-map-notice/ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODERATION_PROVIDER
              value: "keyword"
            # 使用 LLM 審核時改成 "llm"，金鑰建議改用 Secret 掛載：
            # kubectl create secret generic openai-key --from-literal=key=sk-xxx
            - name: OPENAI_API_KEY
              value: ""
            - name: OPENAI_MODEL
              value: "gpt-4o-mini"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: realtime-map-notice
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000
