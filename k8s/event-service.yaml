apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: realtime-map-notice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: realtime-map-notice/event-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:8000
            - name: NOTIFICATION_FANOUT_CONCURRENCY
              value: "100"
            - name: EVENT_IDEMPOTENCY_PREFIX
              value: realtime_map_notice:event:idempotency
            - name: EVENT_IDEMPOTENCY_TTL_SECONDS
              value: "300"
            - name: CORS_ALLOW_ORIGINS
              value: http://localhost:5173,http://localhost:3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: event-service
  namespace: realtime-map-notice
spec:
  selector:
    app: event-service
  ports:
    - port: 8000
      targetPort: 8000
