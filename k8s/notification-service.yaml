apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: realtime-map-notice
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: realtime-map-notice/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis.realtime-map-notice.svc.cluster.local:6379/0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: realtime-map-notice
spec:
  selector:
    app: notification-service
  ports:
    - port: 8000
      targetPort: 8000
