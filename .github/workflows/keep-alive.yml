# Keep Alive：每 10 分鐘 ping 一次 Unified API，防止 Render 免費層休眠。
# （rmn-api 為 Starter 付費執行個體本不會休眠，此排程作為雙保險並兼作健康監控；
#  GitHub 排程工作於 repo 60 天無活動後會自動停用，屆時重新 push 即可。）
name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Unified API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://rmn-api.onrender.com/healthz || echo "000")
          echo "$(date -u +%H:%M:%S) rmn-api /healthz → $code"
