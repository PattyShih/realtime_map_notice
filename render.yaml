# Render Blueprint：一鍵部署四個後端服務 + Redis（皆為免費層）。
# 使用方式：Render Dashboard → New + → Blueprint → 選擇本 repo 與分支 → Apply。
# sync: false 的環境變數會在建立時要求手動填入，詳細步驟與前端部署見 DEPLOY.md。
services:
  # Unified API：單一 Starter 執行個體掛載四個微服務（每月 7 美元）。
  # 啟用後請於 Vercel 更新四個 VITE_ 服務網址指向 rmn-api，並暫停下列
  # 四個免費服務（免費層每月 750 執行個體小時，四服務不敷使用）。
  - type: web
    name: rmn-api
    runtime: docker
    dockerfilePath: ./backend/unified-service/Dockerfile
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: rmn-redis
          property: connectionString
      - key: NOTIFICATION_SERVICE_URL
        value: https://rmn-api.onrender.com/notify
      - key: AI_SERVICE_URL
        value: https://rmn-api.onrender.com/ai
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        value: dev-internal-key
      - key: GEMINI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      - key: CORS_ALLOW_ORIGINS
        sync: false

  - type: web
    name: rmn-location
    runtime: docker
    dockerfilePath: ./backend/location-service/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: rmn-redis
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        sync: false   # 填前端網址，例如 https://xxx.vercel.app

  - type: web
    name: rmn-event
    runtime: docker
    dockerfilePath: ./backend/event-service/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: rmn-redis
          property: connectionString
      - key: NOTIFICATION_SERVICE_URL
        value: https://rmn-notification.onrender.com
      - key: AI_SERVICE_URL
        value: https://rmn-ai.onrender.com
      - key: GOOGLE_CLIENT_ID   # Google 登入：與前端 VITE_GOOGLE_CLIENT_ID 同一個（見 DEPLOY.md）
        sync: false
      - key: JWT_SECRET   # 系統 JWT 簽章金鑰：openssl rand -hex 32 產生隨機長字串
        generateValue: true   # 自動產生隨機值
      - key: CORS_ALLOW_ORIGINS
        sync: false

  - type: web
    name: rmn-notification
    runtime: docker
    dockerfilePath: ./backend/notification-service/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: rmn-redis
          property: connectionString
      - key: VAPID_PUBLIC_KEY
        sync: false   # 手機推播用，npx web-push generate-vapid-keys 產生；留空僅停用 Web Push
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      - key: CORS_ALLOW_ORIGINS
        sync: false

  - type: web
    name: rmn-ai
    runtime: docker
    dockerfilePath: ./backend/ai-service/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: AI_PROVIDER   # openai 或 gemini
        value: gemini
      - key: ANALYSIS_PROVIDER
        value: llm
      - key: MODERATION_PROVIDER
        value: llm
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_TIMEOUT_SECONDS
        value: "30"
      - key: CORS_ALLOW_ORIGINS
        sync: false

  - type: redis
    name: rmn-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []   # 僅允許同專案內部服務連線
