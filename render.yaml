# Render Blueprint：一鍵部署四個後端服務 + Redis（皆為免費層）。
# 使用方式：Render Dashboard → New + → Blueprint → 選擇本 repo 與分支 → Apply。
# sync: false 的環境變數會在建立時要求手動填入，詳細步驟與前端部署見 DEPLOY.md。
services:
  - type: web
    name: rmn2-location
    runtime: docker
    dockerfilePath: ./backend/location-service/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: rmn2-redis
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        sync: false   # 填前端網址，例如 https://xxx.vercel.app

  - type: web
    name: rmn2-event
    runtime: docker
    dockerfilePath: ./backend/event-service/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: rmn2-redis
          property: connectionString
      - key: NOTIFICATION_SERVICE_URL
        value: https://rmn2-notification.onrender.com
      - key: AI_SERVICE_URL
        value: https://rmn2-ai.onrender.com
      - key: GOOGLE_CLIENT_ID   # Google 登入：與前端 VITE_GOOGLE_CLIENT_ID 同一個（見 DEPLOY.md）
        sync: false
      - key: JWT_SECRET   # 系統 JWT 簽章金鑰：openssl rand -hex 32 產生隨機長字串
        generateValue: true   # 自動產生隨機值
      - key: CORS_ALLOW_ORIGINS
        sync: false

  - type: web
    name: rmn2-notification
    runtime: docker
    dockerfilePath: ./backend/notification-service/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: rmn2-redis
          property: connectionString
      - key: VAPID_PUBLIC_KEY
        sync: false   # 手機推播用，npx web-push generate-vapid-keys 產生；留空僅停用 Web Push
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      - key: CORS_ALLOW_ORIGINS
        sync: false

  - type: web
    name: rmn2-ai
    runtime: docker
    dockerfilePath: ./backend/ai-service/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: AI_PROVIDER   # openai 或 gemini
        value: gemini
      - key: ANALYSIS_PROVIDER
        value: llm
      - key: MODERATION_PROVIDER
        value: llm
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_TIMEOUT_SECONDS
        value: "30"
      - key: CORS_ALLOW_ORIGINS
        sync: false

  - type: redis
    name: rmn2-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []   # 僅允許同專案內部服務連線
